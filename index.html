<canvas id="cv"></canvas>
<input type="file" id="file-input" accept="audio/*">

<div id="panel">
<div id="panel-body">

  <div class="sec">

      <span class="cl">Base Bright</span>

    <div id="rec-timer"></div>
    <div id="rec-note">Saves as .webm &middot; plays in Chrome, Firefox, VLC<br>Convert to MP4 free with HandBrake or ffmpeg</div>
  </div>

</div>
</div>
<script>
const IMG_SRCS = {
  bass:    'images/bass.png',
  mids:    'images/Mids.png',
  midhigh: 'images/Midhigh.png',
  highs:   'images/Highs.png',
};
const IMGS = {};
const BBOXES = {};
const PROCESSED = {}; // pre-processed canvases: exterior black → transparent
let imgsLoaded = 0;

function processImage(img, key) {
  // Work at half-resolution for speed (~270K pixels vs 1.16M)
  const S = Math.min(540, img.naturalWidth || 540);
  const osc = document.createElement('canvas');
  osc.width = S; osc.height = S;
  const octx = osc.getContext('2d');
  octx.drawImage(img, 0, 0, S, S);
  const id = octx.getImageData(0, 0, S, S);
  const data = id.data;
  const n = S * S;

  // Mark black pixels (sum of RGB < 60)
  const isBlack = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    isBlack[i] = (data[i*4] + data[i*4+1] + data[i*4+2]) < 60 ? 1 : 0;
  }

  // BFS flood-fill from all 4 edges to find exterior black
  const exterior = new Uint8Array(n);
  const q = [];
  function seed(p) { if (isBlack[p] && !exterior[p]) { exterior[p]=1; q.push(p); } }
  for (let x=0; x<S; x++) { seed(x); seed((S-1)*S+x); }
  for (let y=1; y<S-1; y++) { seed(y*S); seed(y*S+S-1); }
  let qi = 0;
  while (qi < q.length) {
    const p = q[qi++], x = p%S, y = (p/S)|0;
    if (x>0   && isBlack[p-1] && !exterior[p-1]) { exterior[p-1]=1; q.push(p-1); }
    if (x<S-1 && isBlack[p+1] && !exterior[p+1]) { exterior[p+1]=1; q.push(p+1); }
    if (y>0   && isBlack[p-S] && !exterior[p-S]) { exterior[p-S]=1; q.push(p-S); }
    if (y<S-1 && isBlack[p+S] && !exterior[p+S]) { exterior[p+S]=1; q.push(p+S); }
  }

  // Make exterior black transparent; compute bbox of remaining visible pixels
  let x1=S, y1=S, x2=0, y2=0;
  for (let i=0; i<n; i++) {
    if (exterior[i]) {
      data[i*4+3] = 0; // transparent
    } else {
      const x=i%S, y=(i/S)|0;
      if (x<x1) x1=x; if (x>x2) x2=x;
      if (y<y1) y1=y; if (y>y2) y2=y;
    }
  }
  octx.putImageData(id, 0, 0);
  PROCESSED[key] = osc;

  const pad = 0.02;
  BBOXES[key] = {
    x:  Math.max(0,   x1/S - pad),
    y:  Math.max(0,   y1/S - pad),
    x2: Math.min(1,   x2/S + pad),
    y2: Math.min(1,   y2/S + pad),
  };
}

Object.entries(IMG_SRCS).forEach(([k,src]) => {
  const img = new Image();
  img.onload = () => { IMGS[k] = img; processImage(img, k); imgsLoaded++; };
  img.src = src;
});

const BANDS = [
  {name:'Sub Bass', range:[20,60]},
  {name:'Bass',     range:[60,250]},
  {name:'Low Mid',  range:[250,500]},
  {name:'Mid',      range:[500,2000]},
  {name:'High Mid', range:[2000,4000]},
  {name:'Presence', range:[4000,6000]},
  {name:'Treble',   range:[6000,20000]},
];

const LAYER_DEFS = [
  {id:'bass',    label:'Bass Bins',  imgKey:'bass',    freqLo:40,   freqHi:250,  desc:'Sub & bass cabinets'},
  {id:'mids',    label:'Mids',       imgKey:'mids',    freqLo:250,  freqHi:2000, desc:'Mid-range horn section'},
  {id:'midhigh', label:'Mid-High',   imgKey:'midhigh', freqLo:2000, freqHi:6000, desc:'Mid-high cabinet'},
  {id:'highs',   label:'High Horn',  imgKey:'highs',   freqLo:6000, freqHi:20000,desc:'High frequency horn'},
];

// State
let audioCtx=null, analyser=null, dataArray=null, gainNode=null, audioDestNode=null;
let demoOsc=null, demoGain=null, mediaStream=null;
let audioBuf=null, bufSrc=null;
let startTime=0, pauseOffset=0, isPaused=false, isRunning=false;
let doLoop=false, mode='idle';
let sensitivity=1.5, glowAmt=12, baseBright=20;
let doTrails=false, doShake=true;
let layers = {};
LAYER_DEFS.forEach(d => { layers[d.id] = {freqLo:d.freqLo, freqHi:d.freqHi, sens:1.5, scaleBoost:0.5, amp:0, as:0, peak:0, vel:0}; });
let mediaRec=null, recChunks=[], recStartTime=0, recTimerInterval=null, isRecording=false;
const shakeState = {};
LAYER_DEFS.forEach(d => { shakeState[d.id] = {x:0, y:0, vx:0, vy:0}; });

// Canvas
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// Panel / fullscreen
document.getElementById('ptab').addEventListener('click', () => { document.body.classList.toggle('panel-collapsed'); resize(); });
document.getElementById('fs-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', () => {
  document.getElementById('fs-btn').textContent = document.fullscreenElement ? '\u2715' : '\u26F6';
});

// Build layer cards — custom dual-range frequency selector
const ll = document.getElementById('layers-list');
ll.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

const FREQ_MIN = 20, FREQ_MAX = 20000;

// Log-scale helpers so the slider feels musical
function freqToLog(f) { return Math.log10(f / FREQ_MIN) / Math.log10(FREQ_MAX / FREQ_MIN); }
function logToFreq(v) { return Math.round(FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, v)); }
function fmtHz(f)     { return f >= 1000 ? (f/1000).toFixed(f%1000===0?0:1)+'k' : f+'Hz'; }

LAYER_DEFS.forEach(d => {
  const c = document.createElement('div');
  c.className = 'lc';
  c.innerHTML =
    '<div class="lc-title"><div class="ldot" id="dot-' + d.id + '"></div>' + d.label + '</div>' +
    '<div class="ldesc">' + d.desc + '</div>' +

    // Frequency range
    '<div class="freq-wrap">' +
      '<span class="freq-label">Freq Range</span>' +
      '<div class="freq-track-wrap">' +
        '<div class="freq-track"></div>' +
        '<div class="freq-fill" id="ff-' + d.id + '"></div>' +
        '<input type="range" class="freq-range" id="flo-' + d.id + '" min="0" max="1000" step="1" value="' + Math.round(freqToLog(d.freqLo)*1000) + '">' +
        '<input type="range" class="freq-range" id="fhi-' + d.id + '" min="0" max="1000" step="1" value="' + Math.round(freqToLog(d.freqHi)*1000) + '">' +
      '</div>' +
      '<div class="freq-vals"><span id="flov-' + d.id + '">' + fmtHz(d.freqLo) + '</span><span id="fhiv-' + d.id + '">' + fmtHz(d.freqHi) + '</span></div>' +
    '</div>' +

    '<div class="lsrow"><span class="ll">Sensitivity</span><input type="range" id="ls-' + d.id + '" min="0.2" max="8" step="0.1" value="1.5" style="flex:1;height:2px;"><span class="lv" id="lsv-' + d.id + '">1.5x</span></div>' +
    '<div class="lsrow"><span class="ll">Scale Boost</span><input type="range" id="lsc-' + d.id + '" min="0" max="2" step="0.05" value="0.5" style="flex:1;height:2px;"><span class="lv" id="lscv-' + d.id + '">0.50</span></div>' +
    '<div class="abar-wrap"><div class="abar" id="bar-' + d.id + '"></div></div>';
  ll.appendChild(c);

  const sLo  = document.getElementById('flo-'  + d.id);
  const sHi  = document.getElementById('fhi-'  + d.id);
  const vLo  = document.getElementById('flov-' + d.id);
  const vHi  = document.getElementById('fhiv-' + d.id);
  const fill = document.getElementById('ff-'   + d.id);

  function updateFill() {
    const lo = parseInt(sLo.value), hi = parseInt(sHi.value);
    fill.style.left  = (lo / 10) + '%';
    fill.style.width = (Math.max(0, hi - lo) / 10) + '%';
  }
  updateFill();

  sLo.addEventListener('input', () => {
    if (parseInt(sLo.value) > parseInt(sHi.value) - 10) sLo.value = parseInt(sHi.value) - 10;
    const f = logToFreq(parseInt(sLo.value) / 1000);
    layers[d.id].freqLo = f;
    vLo.textContent = fmtHz(f);
    updateFill();
  });
  sHi.addEventListener('input', () => {
    if (parseInt(sHi.value) < parseInt(sLo.value) + 10) sHi.value = parseInt(sLo.value) + 10;
    const f = logToFreq(parseInt(sHi.value) / 1000);
    layers[d.id].freqHi = f;
    vHi.textContent = fmtHz(f);
    updateFill();
  });

  document.getElementById('ls-' + d.id).addEventListener('input', e => {
    layers[d.id].sens = parseFloat(e.target.value);
    document.getElementById('lsv-' + d.id).textContent = parseFloat(e.target.value).toFixed(1) + 'x';
  });
  document.getElementById('lsc-' + d.id).addEventListener('input', e => {
    layers[d.id].scaleBoost = parseFloat(e.target.value);
    document.getElementById('lscv-' + d.id).textContent = parseFloat(e.target.value).toFixed(2);
  });
});

// Visual controls
document.getElementById('sens').addEventListener('input', e => { sensitivity=parseFloat(e.target.value); document.getElementById('sens-v').textContent=sensitivity.toFixed(1)+'x'; });
document.getElementById('glow').addEventListener('input', e => { glowAmt=parseInt(e.target.value); document.getElementById('glow-v').textContent=glowAmt; });
document.getElementById('base-bright').addEventListener('input', e => { baseBright=parseInt(e.target.value); document.getElementById('bb-v').textContent=baseBright; });
document.getElementById('trail-tog').addEventListener('click', function() { doTrails=!doTrails; this.classList.toggle('on',doTrails); });
document.getElementById('shake-tog').addEventListener('click', function() { doShake=!doShake; this.classList.toggle('on',doShake); });
document.getElementById('vol').addEventListener('input', e => { if(gainNode) gainNode.gain.value=parseFloat(e.target.value); });

// Transport
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-stop').addEventListener('click', stopSong);
document.getElementById('btn-back').addEventListener('click', () => seek(-10));
document.getElementById('btn-fwd').addEventListener('click',  () => seek(10));
document.getElementById('btn-loop').addEventListener('click', function() { doLoop=!doLoop; this.classList.toggle('on',doLoop); });
document.getElementById('prog-wrap').addEventListener('click', e => {
  if (!audioBuf) return;
  const r = e.currentTarget.getBoundingClientRect();
  playFrom(((e.clientX - r.left) / r.width) * audioBuf.duration);
});

// File upload
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  stopSong(); await initAudio(); st('Decoding...');
  try {
    audioBuf = await audioCtx.decodeAudioData(await file.arrayBuffer());
    document.getElementById('song-name').textContent = file.name.replace(/\.[^.]+$/, '');
    document.getElementById('t-total').textContent = fmt(audioBuf.duration);
    mode = 'song'; setTransport(true); playFrom(0);
  } catch(err) { st('Cannot decode - try MP3, WAV or OGG'); }
  e.target.value = '';
});

document.getElementById('mic-btn').addEventListener('click', async () => {
  try {
    stopSong(); await initAudio();
    mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx.createMediaStreamSource(mediaStream).connect(analyser);
    isRunning=true; mode='mic'; st('Mic active');
    setPlayBtn('\u25A0'); setTransport(false);
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('mic-btn').classList.add('lit');
    document.getElementById('demo-btn').classList.remove('lit');
  } catch(e) { st('Mic denied'); }
});

document.getElementById('demo-btn').addEventListener('click', () => {
  stopSong(); initAudio().then(() => {
    demoGain = audioCtx.createGain(); demoGain.gain.value = 0.05;
    demoOsc = audioCtx.createOscillator(); demoOsc.type = 'sawtooth';
    demoOsc.connect(demoGain); demoGain.connect(analyser);
    const t = audioCtx.currentTime;
    [60,80,110,160,220,440,880,1760,3520].forEach((f,i) => demoOsc.frequency.setValueAtTime(f, t+i*1.2));
    demoOsc.frequency.setValueAtTime(60, t+11);
    demoOsc.start();
    isRunning=true; mode='demo'; st('Demo - sweeping');
    setPlayBtn('\u25A0'); setTransport(false);
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('demo-btn').classList.add('lit');
    document.getElementById('mic-btn').classList.remove('lit');
  });
});

// Audio core
async function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  else if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (!analyser) {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.82;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }
  if (!gainNode) {
    gainNode = audioCtx.createGain();
    gainNode.gain.value = parseFloat(document.getElementById('vol').value);
    audioDestNode = audioCtx.createMediaStreamDestination();
    gainNode.connect(audioCtx.destination);
    gainNode.connect(audioDestNode);
  }
}

function playFrom(offset) {
  if (!audioBuf || !audioCtx) return;
  if (bufSrc) { try { bufSrc.stop(); } catch(e) {} bufSrc = null; }
  bufSrc = audioCtx.createBufferSource();
  bufSrc.buffer = audioBuf;
  bufSrc.connect(analyser);
  if (gainNode) analyser.connect(gainNode);
  pauseOffset = Math.max(0, Math.min(offset, audioBuf.duration));
  startTime = audioCtx.currentTime - pauseOffset;
  bufSrc.start(0, pauseOffset);
  bufSrc.onended = () => {
    if (!isPaused) {
      if (doLoop) { playFrom(0); return; }
      isRunning = false; setPlayBtn('\u25B6'); st('Finished');
    }
  };
  isRunning=true; isPaused=false; mode='song';
  setPlayBtn('\u23F8');
  st('Playing: ' + document.getElementById('song-name').textContent);
  document.getElementById('mic-btn').classList.remove('lit');
  document.getElementById('demo-btn').classList.remove('lit');
}

function togglePlay() {
  if (!audioBuf) { st('Upload a song first'); return; }
  if (isRunning && !isPaused) {
    pauseOffset = audioCtx.currentTime - startTime;
    if (bufSrc) { try { bufSrc.stop(); } catch(e) {} bufSrc = null; }
    isPaused=true; isRunning=false; setPlayBtn('\u25B6'); st('Paused');
  } else { playFrom(isPaused ? pauseOffset : 0); }
}

function stopSong() {
  if (bufSrc)      { try { bufSrc.stop();   } catch(e) {} bufSrc = null; }
  if (demoOsc)     { try { demoOsc.stop();  } catch(e) {} demoOsc = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  isRunning=false; isPaused=false; setPlayBtn('\u25B6'); st('Stopped');
  if (mode==='song') { pauseOffset=0; document.getElementById('prog-fill').style.width='0%'; document.getElementById('t-elapsed').textContent='0:00'; }
  document.getElementById('mic-btn').classList.remove('lit');
  document.getElementById('demo-btn').classList.remove('lit');
  if (mode==='mic' || mode==='demo') setTransport(audioBuf != null);
  mode = audioBuf ? 'song' : 'idle';
}

function seek(delta) {
  if (!audioBuf) return;
  const cur = isRunning ? audioCtx.currentTime - startTime : pauseOffset;
  playFrom(cur + delta);
}

function setTransport(has) { ['btn-play','btn-stop','btn-back','btn-fwd','btn-loop'].forEach(id => { document.getElementById(id).disabled = !has; }); }
function setPlayBtn(icon) { document.getElementById('btn-play').textContent = icon; }
function st(msg) { document.getElementById('status').textContent = msg; }
function fmt(s) { const m=Math.floor(s/60),ss=Math.floor(s%60); return m+':'+ss.toString().padStart(2,'0'); }

// Frequency analysis
function getBandAmp(id, layerSens) {
  if (!analyser || !dataArray || !isRunning) return 0;
  analyser.getByteFrequencyData(dataArray);
  const L = layers[id];
  const nyq = audioCtx.sampleRate / 2, bins = analyser.frequencyBinCount;
  const lo = Math.max(0,      Math.floor(L.freqLo / nyq * bins));
  const hi = Math.min(bins-1, Math.ceil( L.freqHi / nyq * bins));
  let s = 0; for (let i=lo; i<=hi; i++) s += dataArray[i];
  return Math.min(1, (hi > lo ? s / ((hi-lo+1)*255) : 0) * sensitivity * layerSens);
}

// Recorder
document.getElementById('rec-btn').addEventListener('click', () => { isRecording ? stopRecording() : startRecording(); });
function startRecording() {
  const canvasStream = cv.captureStream(60);
  const tracks = [...canvasStream.getVideoTracks()];
  if (audioDestNode) audioDestNode.stream.getAudioTracks().forEach(t => tracks.push(t));
  const combined = new MediaStream(tracks);
  const mimeType = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  recChunks = [];
  try { mediaRec = new MediaRecorder(combined, {mimeType, videoBitsPerSecond:8000000}); }
  catch(e) { mediaRec = new MediaRecorder(combined); }
  mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRec.onstop = () => downloadRecording();
  mediaRec.start(100);
  isRecording=true; recStartTime=Date.now();
  recTimerInterval = setInterval(updateRecTimer, 500); updateRecTimer();
  document.getElementById('rec-btn').classList.add('recording');
  document.getElementById('rec-label').textContent = 'Stop & Save';
  document.getElementById('rec-timer').textContent = '\u23FA Recording 0:00';
}
function stopRecording() {
  if (!isRecording || !mediaRec) return;
  isRecording=false; clearInterval(recTimerInterval); mediaRec.stop();
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-label').textContent = 'Start Recording';
  document.getElementById('rec-timer').textContent = 'Saving...';
}
function updateRecTimer() {
  if (!isRecording) return;
  const s = Math.floor((Date.now()-recStartTime)/1000);
  document.getElementById('rec-timer').textContent = '\u23FA Recording ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function downloadRecording() {
  if (!recChunks.length) return;
  const blob = new Blob(recChunks, {type:'video/webm'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='soundsystem-' + new Date().toISOString().slice(0,19).replace(/[T:]/g,'-') + '.webm';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  recChunks = [];
  document.getElementById('rec-timer').textContent = 'Saved \u2713';
  setTimeout(() => { document.getElementById('rec-timer').textContent = ''; }, 3000);
}

// ── Geometry — computed ONCE per frame, stored on each layer ─────────────────
function computeAllGeometry() {
  const panelOpen = !document.body.classList.contains('panel-collapsed');
  const availW = cv.width - (panelOpen ? 264 : 0);
  const availH = cv.height;
  const size   = Math.min(availW, availH) * 0.66;
  const baseX  = (availW - size) / 2;
  const baseY  = (availH - size) / 2;

  LAYER_DEFS.forEach(d => {
    const L  = layers[d.id];
    const sh = shakeState[d.id];
    if (!L || !sh) return;
    // Add velocity on transients
    if (doShake && L.amp > 0.25) {
      const sk = (d.id==='bass') ? 1.0 : (d.id==='mids') ? 0.55 : (d.id==='midhigh') ? 0.35 : 0.2;
      sh.vx += (Math.random()-0.5) * L.amp * 10 * sk;
      sh.vy += (Math.random()-0.5) * L.amp *  6 * sk;
    }
    // Decay (runs once per frame)
    sh.vx *= 0.68; sh.vy *= 0.68;
    sh.x  += sh.vx; sh.y += sh.vy;
    sh.x  *= 0.78;  sh.y *= 0.78;

    const drawSize = size * (1 + L.amp * L.scaleBoost);
    L.geom = {
      imgX:     baseX - (drawSize - size) / 2 + sh.x,
      imgY:     baseY - (drawSize - size) / 2 + sh.y,
      drawSize,
    };
  });
}

// Pass 1 — glow halos (screen blend + blur), draws from stored geometry
function drawLayerGlow(imgKey, id) {
  const L = layers[id];
  if (!L || !L.geom || !IMGS[imgKey] || L.amp < 0.01 || glowAmt < 1) return;
  const { imgX, imgY, drawSize } = L.geom;
  const bright = 80 + baseBright + L.amp * 180;
  const blur   = L.amp * glowAmt;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.filter = 'brightness(' + bright.toFixed(0) + '%) blur(' + blur.toFixed(1) + 'px)';
  ctx.drawImage(IMGS[imgKey], imgX, imgY, drawSize, drawSize);
  ctx.restore();
}

// Pass 2 — solid image (source-over, no blur, exterior already transparent)
// interior black stays fully opaque; no bbox clip needed — transparent pixels auto-hide
function drawLayerSolid(imgKey, id) {
  const L = layers[id];
  if (!L || !L.geom || !PROCESSED[imgKey]) return;
  const { imgX, imgY, drawSize } = L.geom;
  const bright = 100 + baseBright + L.amp * 120;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'brightness(' + bright.toFixed(0) + '%)';
  ctx.drawImage(PROCESSED[imgKey], imgX, imgY, drawSize, drawSize);
  ctx.restore();
}

// Animation
function animate() {
  requestAnimationFrame(animate);

  // Amplitude smoothing with punch
  Object.keys(layers).forEach(id => {
    const L = layers[id];
    const tgt = getBandAmp(id, L.sens);
    L.as += (tgt - L.as) * (tgt > L.as ? 0.45 : 0.06);
    if (tgt > L.peak + 0.07) { L.vel += (tgt - L.peak) * 0.55; L.peak = tgt; }
    L.peak *= 0.92; L.vel *= 0.70;
    L.amp = Math.min(1.0, L.as + L.vel * 0.3);
  });

  // Update meters
  LAYER_DEFS.forEach(({id}) => {
    const a = layers[id].amp;
    const bar = document.getElementById('bar-' + id);
    const dot = document.getElementById('dot-' + id);
    if (bar) bar.style.width = (a * 100) + '%';
    if (dot) dot.style.boxShadow = '0 0 ' + (4+a*12) + 'px ' + (2+a*5) + 'px rgba(255,255,255,' + (0.25+a*0.75) + ')';
  });

  // Progress bar update
  if (audioBuf && audioCtx && isRunning && !isPaused && mode==='song') {
    const el = Math.min(audioCtx.currentTime - startTime, audioBuf.duration);
    document.getElementById('prog-fill').style.width = (el / audioBuf.duration * 100) + '%';
    document.getElementById('t-elapsed').textContent = fmt(el);
  }

  // Compute shake + scale geometry ONCE per frame for all layers
  computeAllGeometry();

  // Background
  if (doTrails) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,cv.width,cv.height); }
  else          { ctx.fillStyle = '#000';             ctx.fillRect(0,0,cv.width,cv.height); }

  // Pass 1 — glow halos (screen+blur), all layers bottom→top
  LAYER_DEFS.forEach(d => drawLayerGlow(d.imgKey, d.id));

  // Pass 2 — solid image clipped to bbox (source-over), all layers bottom→top
  // same position as glow pass → solid black correctly covers all inner areas
  LAYER_DEFS.forEach(d => drawLayerSolid(d.imgKey, d.id));
}

animate();
</script>
</body>
